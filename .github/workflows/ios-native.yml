# Сборка Swift-версии для iPhone (папка swift/) на облачном Mac. Без подписи: .ipa ставится Sideloadly.
# Запуск: вкладка Actions → «iOS native» → Run workflow.
name: iOS native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode (последний стабильный на этом Mac)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Проект Xcode из project.yml
        working-directory: swift
        run: |
          xcodebuild -version
          xcodegen generate

      - name: Сборка (без подписи)
        working-directory: swift
        run: |
          set -o pipefail
          xcodebuild -project AOBible.xcodeproj -scheme AOBible -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log > /dev/null \
            || { echo '--- ошибки компилятора ---'; grep -E "error:|warning: .*(unavailable|deprecated)" build.log | sort -u | head -60; exit 1; }

      - name: Файл .ipa
        working-directory: swift
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AOBible.app Payload/
          zip -qry AOBible-native-unsigned.ipa Payload
          ls -la AOBible-native-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AOBible-native-unsigned
          path: swift/AOBible-native-unsigned.ipa
          retention-days: 14

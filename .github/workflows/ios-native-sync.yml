# Автотест синхронной прокрутки на симуляторе: настоящие касания, журнал каждого кадра (sync-trace.csv) и снимки.
# Запуск: вкладка Actions → «iOS native sync test» → Run workflow.
name: iOS native sync test

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Только этот тест, например AOBibleUITests/ReaderModesUITests/test1Pages (пусто — все)"
        default: ""

jobs:
  sync:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Проект
        working-directory: swift
        run: xcodegen generate --spec project-uitest.yml

      - name: Автотест
        working-directory: swift
        run: |
          mkdir -p out
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for x in devs:
                  if 'iPhone' in x['name'] and x['isAvailable']:
                      print(x['udid']); sys.exit()
          ")
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          # снимки экрана, пока идёт прокрутка (когда появился журнал)
          (
            n=0
            while [ $n -lt 45 ]; do
              C=$(xcrun simctl get_app_container "$DEV" app.aobible data 2>/dev/null || true)
              if [ -n "$C" ] && [ -f "$C/Documents/sync-trace.csv" ]; then
                n=$((n+1))
                xcrun simctl io "$DEV" screenshot "out/shot-$(printf %02d $n).png" >/dev/null 2>&1 || true
                sleep 2
              else
                sleep 1
              fi
            done
          ) &
          SHOTS=$!
          set +e
          ONLY=$(echo "${{ inputs.only }}" | tr ',' ' ' | xargs -n1 2>/dev/null | sed 's/^/-only-testing:/' | tr '\n' ' ')
          xcodebuild test -project AOBible.xcodeproj -scheme AOBibleUITests -destination "id=$DEV" $ONLY \
            -derivedDataPath build -parallel-testing-enabled NO -resultBundlePath out/result.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/test.log | tail -40
          xcrun xcresulttool export attachments --path out/result.xcresult --output-path out/attachments >/dev/null 2>&1 || true
          kill $SHOTS 2>/dev/null || true
          mkdir -p out/crash; cp ~/Library/Logs/DiagnosticReports/*.ips out/crash/ 2>/dev/null || true; ls ~/Library/Logs/DiagnosticReports | head -5
          C=$(xcrun simctl get_app_container "$DEV" app.aobible data 2>/dev/null || true)
          [ -n "$C" ] && cp "$C/Documents/sync-trace.csv" out/ 2>/dev/null
          wc -l out/sync-trace.csv || true
          grep -E "error:|Test Case|Executed" out/test.log | tail -20
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: AOBible-sync-test
          path: swift/out
          retention-days: 7

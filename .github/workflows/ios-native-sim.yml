# Проверка Swift-версии на симуляторе iPhone: сборка, запуск, снимки экранов (чтение, «Ещё», планы, закладки).
# Запуск: вкладка Actions → «iOS native simulator» → Run workflow.
name: iOS native simulator

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Проект
        working-directory: swift
        run: xcodegen generate

      - name: Сборка для симулятора
        working-directory: swift
        run: |
          set -o pipefail
          xcodebuild -project AOBible.xcodeproj -scheme AOBible -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Запуск и снимки
        working-directory: swift
        run: |
          mkdir -p shots
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for x in devs:
                  if 'iPhone' in x['name'] and x['isAvailable']:
                      print(x['udid']); sys.exit()
          ")
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          APP=build/Build/Products/Debug-iphonesimulator/AOBible.app
          xcrun simctl install "$DEV" "$APP"
          # первый запуск: приветствие и стартовая установка модулей
          xcrun simctl launch "$DEV" app.aobible
          sleep 12
          xcrun simctl io "$DEV" screenshot shots/01-welcome.png
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES
          sleep 90
          xcrun simctl io "$DEV" screenshot shots/02-reader-after-install.png
          for tab in more plans saved; do
            xcrun simctl terminate "$DEV" app.aobible || true
            xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugTab $tab
            sleep 8
            xcrun simctl io "$DEV" screenshot shots/03-$tab.png
          done
          for v in appearance settings mydata about news help library dictionary maps audio sermons; do
            xcrun simctl terminate "$DEV" app.aobible || true
            xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugView $v
            sleep 5
            xcrun simctl io "$DEV" screenshot shots/05-$v.png
          done
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugSearch "Бог"
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/06-search.png
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugGoto YES
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/07-goto.png
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugWord YES
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/08-word.png
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugSelect YES
          sleep 6
          xcrun simctl io "$DEV" screenshot shots/09-select.png
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl terminate "$DEV" app.aobible || true
          xcrun simctl launch "$DEV" app.aobible -welcomeSeen YES -debugTab bible
          sleep 8
          xcrun simctl io "$DEV" screenshot shots/04-reader-dark.png
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: AOBible-sim-shots
          path: swift/shots
          retention-days: 7

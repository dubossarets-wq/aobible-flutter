# Проект с автотестами (только для проверки на симуляторе; обычная сборка .ipa идёт по project.yml и тестов не содержит).
# Запуск: xcodegen generate --spec project-uitest.yml
include:
  - project.yml
targets:
  KolosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KolosUITests
    dependencies:
      - target: Kolos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.aobible.uitests
schemes:
  KolosUITests:
    build:
      targets:
        Kolos: all
        KolosUITests: [test]
    test:
      config: Debug
      targets:
        - KolosUITests
